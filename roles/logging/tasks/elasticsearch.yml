---

- name: "Install default-jdk {{ inventory_hostname }}"
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - default-jdk

- name: Copy elk-8.9-deb
  copy:
    src: "{{ elk_deb_dir }}"
    dest: /tmp/elk-8.9-deb
    force: no

- name: Install elk-8.9-deb package
  apt:
    deb: "/tmp/elk-8.9-deb/{{ item }}"
  loop:
    - elasticsearch-8.9.1-amd64.deb
    - heartbeat-8.9.1-amd64.deb
    - kibana-8.9.1-amd64.deb
    - logstash-8.9.1-amd64.deb
    - metricbeat-8.9.1-amd64.deb
    - packetbeat-8.9.1-amd64.deb

- name: Update jvm.options
  template:
    src: ./templates/jvm.options.j2
    dest: /etc/elasticsearch/jvm.options.d/jvm.options
    mode: 0644
    owner: root
    group: elasticsearch

- name: Update elasticsearch.yml
  template:
    src: ./templates/elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    mode: 0660
    owner: root
    group: elasticsearch

- name: Update kibana.yml
  template:
    src: ./templates/kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    mode: 0660
    owner: root
    group: kibana

- name: Update logstash.yml
  template:
    src: ./templates/logstash.yml.j2
    dest: /etc/logstash/logstash.yml
    mode: 0644
    owner: root
    group: root

- name: Update logstash-nginx-es.conf
  template:
    src: ./templates/logstash-nginx-es.conf.j2
    dest: /etc/logstash/conf.d/logstash-nginx-es.conf
    mode: 0644
    owner: root
    group: root

- name: Restart elk service
  systemd_service:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ item }}"
  register: servDetails
  until: servDetails.status.ActiveState == "active"
  delay: 20
  retries: 20
  loop:
    - elasticsearch.service
    - kibana.service
    - logstash.service
    - metricbeat

- name: Copy kibana dashboard
  copy:
    src: kibana_nginx_dashboard_export.ndjson
    dest: /tmp/kibana_nginx_dashboard_export.ndjson

- name: Wait for kibana port to become open on the host
  wait_for:
    port: "{{ kibana_port }}"
    delay: 10

- name: Import kibana dashboard
  shell: "curl -k \
    -X POST http://{{ hostvars['monitoring']['ansible_host'] }}:{{ kibana_port }}/api/saved_objects/_import?createNewCopies=true \
    -H 'kbn-xsrf: true' --form file=@/tmp/kibana_nginx_dashboard_export.ndjson"

