- name: Restart elk service
  systemd_service:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ item }}"
  register: servDetails
  until: servDetails.status.ActiveState == "active"
  delay: 20
  retries: 20
  loop:
    - elasticsearch.service
    - kibana.service
    - logstash.service
 #   - filebeat
    - metricbeat

- name: Copy kibana dashboard
  copy:
    src: ./files/kibana_nginx_dashboard_export.ndjson
    dest: /tmp/kibana_nginx_dashboard_export.ndjson

- name: Wait for kibana port to become open on the host
  wait_for:
    port: 5601
    delay: 10

- name: Import kibana dashboard
  shell: "curl -k \
    -X POST http://{{ hostvars['monitoring']['ansible_host'] }}:5601/api/saved_objects/_import?createNewCopies=true \
    -H 'kbn-xsrf: true' --form file=@/tmp/kibana_nginx_dashboard_export.ndjson"

