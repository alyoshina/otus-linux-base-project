---

- name: "Install grafana {{ inventory_hostname }}"
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - adduser
    - libfontconfig1
    - musl

- name: Copy grafana_11.22.2
  copy:
    src: "{{ grafana_deb_path }}"
    dest: /tmp/grafana_11.2.2_amd64-224190-c9d6aa.deb
    force: no

- name: Install a grafana.deb package
  apt:
    deb: /tmp/grafana_11.2.2_amd64-224190-c9d6aa.deb

- name: Restart service grafana, in all cases, also issue daemon-reload to pick up config changes
  systemd_service:
    state: restarted
    enabled: true
    daemon_reload: true
    name: grafana-server
  
- name: Wait for grafana, prometheus port to become open on the host
  wait_for:
    port: "{{ item }}"
    delay: 10
  loop:
   - "{{ grafana_port }}"
   - "{{ prometheus_port }}"

- name: create prometheus datasource
  grafana_datasource:
    name: prometheus
    ds_type: prometheus
    ds_url: "http://localhost:{{ prometheus_port }}"
    url_username: "{{ grafana_user }}"
    url_password: "{{ grafana_password }}"
    url: "http://localhost:{{ grafana_port }}"
    access: proxy
    uid: "de3ebdbwzvocgf"
    org_id: 1
    additional_json_data:
      httpMethod: "POST"
    tls_skip_verify: true

- name: Copy dashboard
  copy:
    src: "files/{{ item }}"
    dest: "/tmp/{{ item }}"
  loop:
    - "mysql_overview_dashboard.json"
    - "nginx_dashboard.json"
    - "node_exporter_full_dashboard.json"

- name: Import dashboard
  grafana_dashboard:
    grafana_url: "http://localhost:{{ grafana_port }}"
    grafana_user: "{{ grafana_user}}"
    grafana_password: "{{ grafana_password }}"
    org_id: 1
    state: present
    path: "/tmp/{{ item }}"
  loop:
    - "mysql_overview_dashboard.json"
    - "nginx_dashboard.json"
    - "node_exporter_full_dashboard.json"
