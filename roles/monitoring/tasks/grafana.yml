- name: Import dashboard
  grafana_dashboard:
    grafana_url: http://localhost:3000
    grafana_user: "admin"
    grafana_password: "admin" #"{{ grafana_password }}"
    org_id: 1
    state: present
 #   folder: Dashboards
 #   uid: "MQWgroiiz"
    path: "/tmp/{{ item }}"
  loop:
    - "mysql_overview_dashboard.json"
    - "nginx_dashboard.json"
    - "node_exporter_full_dashboard.json"






